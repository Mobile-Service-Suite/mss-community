name: Сообщить об ошибке
description: Воспроизводимая ошибка в актуальной версии MSS
title: "[Ошибка] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте резервные копии, IPA/APK, контейнеры MSS, пароли, токены и персональные данные.
  - type: input
    id: version
    attributes:
      label: Версия MSS
      placeholder: "0.5.0 beta, build 0024"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows и устройство
      placeholder: "Windows 11 24H2; iPhone 14 Pro Max, iOS 18.7.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Перечислите действия по порядку.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Обезличенный журнал
      description: Удалите Apple ID, номера телефонов, UDID, серийные номера, пути с именем пользователя и любые секреты.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я удалил(а) из обращения персональные данные и секреты.
          required: true
