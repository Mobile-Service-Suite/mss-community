name: Предложить улучшение
description: Идея новой функции или улучшения рабочего процесса
title: "[Предложение] "
labels:
  - enhancement
body:
  - type: textarea
    id: task
    attributes:
      label: Практическая задача
      description: Что требуется сделать в сервисном центре?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Как задача решается сейчас
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: ready
    attributes:
      label: Критерий готовности
      description: Как проверить, что функция действительно решает задачу?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: В обращении нет персональных данных клиентов и секретов.
          required: true
